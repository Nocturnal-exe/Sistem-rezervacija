<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ naslov }} // NEON GYM</title>
<style>
  :root { --bg:#07060f; --panel:#100d1f; --cyan:#00f0ff; --pink:#ff2bd6; --yellow:#f5e642; --text:#d6e4ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text);
    font-family: "Consolas", "Courier New", monospace;
    background:
      linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px) 0 0 / 40px 40px,
      radial-gradient(ellipse at top, #1a0f3a 0%, var(--bg) 60%);
  }
  .kutija { max-width: 440px; margin: 16px; background: var(--panel); border: 1px solid var(--cyan); padding: 32px 28px; text-align: center;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px)); box-shadow: inset 0 0 24px rgba(0,240,255,0.15); }
  h2 { margin: 0 0 16px; color: var(--pink); letter-spacing: 4px; text-shadow: 0 0 10px var(--pink); }
  p { line-height: 1.8; opacity: 0.9; }
  a { color: var(--cyan); text-shadow: 0 0 6px var(--cyan); }
</style>
</head>
<body>
  <div class="kutija">
    <h2>{{ naslov }}</h2>
    <p>{{ tekst }}</p>
    <a href="{% url 'prijava' %}">&lt; NA PRIJAVU</a>
  </div>
</body>
</html>
